<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EBS 학습 시스템 회원가입</title>
  <link rel="icon" href="../images/favicon.png">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive-mobile.css">
  <link rel="stylesheet" href="../css/responsive-tablet.css">
  <script src="../script/custom.js"></script>
</head>
<body>
  <div class="container member-register">
    <div class="header-include"></div>
    <section class="signup">
      <div class="member-register">
        <div class="member-account">
          <h1 class="login-slogan">
            자기주도 학습의 시작,<br>
            <em>EBSi</em>와 함께하세요.
          </h1>
          <img src="../images/ct-modal-01.png" alt="">
        </div>
        <div class="login-field">
          <div>
            <input type="email" placeholder="EBSi 계정 (이메일)">
          </div>
          <div>
            <input type="password" placeholder="비밀번호" maxlength="12">
            <i class="toggle-pw bi bi-eye-slash"></i>
          </div>
          <div>
            <input type="password" placeholder="비밀번호 확인" maxlength="12">
            <i class="toggle-pw bi bi-eye-slash"></i>
          </div>
          <button class="btn-member-primary">회원가입</button>
        </div>
        <div class="agreement">
          <p>
            회원가입 시, 통합 계정으로 EBSi에서 제공하는 모든 학습 서비스를 이용하실 수 있습니다. EBSi 이용약관, 개인정보처리방침에 동의합니다.
          </p>
          <label>
            <input type="checkbox"><em></em>EBSi 학습 정보 및 교육 콘텐츠 소식 수신에 동의합니다.
          </label>
        </div>
        <div class="login-member">
          이미 EBSi 계정이 있으신가요? <a href="#none">로그인하기</a>
        </div>
      </div>
    </section>
    <div class="footer-include"></div>
  </div>
  <script src="../script/custom.js"></script>
</body>
</html>
